<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subjects</title>
    <link rel="stylesheet" href="/static/css/global.css" />
    <link rel="stylesheet" href="/static/css/tables.css" />
    <link rel="stylesheet" href="/static/css/forms.css" />
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar"><div class="brand">SeatingSystem</div><nav><a href="/dashboard">Dashboard</a><a href="/students">Students</a><a href="/teachers">Teachers</a><a href="/rooms">Rooms</a><a class="active" href="/subjects">Subjects</a><a href="/exams">Exams</a><a href="/timetable">Timetable</a><a href="/seating">Seating</a><a href="/attendance">Attendance</a><a href="/reports">Reports</a><a href="/notifications">Notifications</a><a href="/settings">Settings</a></nav></aside>
        <main class="content"><div class="topbar"><h2>Subject Management</h2><div class="topbar-right"><button class="secondary-btn" onclick="setTheme(!document.body.classList.contains('dark-mode'))">Dark Mode</button><button class="primary-btn" onclick="logoutUser()">Logout</button></div></div>
            <section class="card" data-admin-only><h3>Add Subject</h3><form id="subject-form" class="form-panel"><input type="text" name="name" placeholder="Subject name" required /><input type="text" name="code" placeholder="Subject code" required /><input type="number" name="credits" placeholder="Credits" value="3" /><div class="form-actions wide"><button type="submit" class="primary-btn">Save Subject</button></div></form></section>
            <section class="card" style="margin-top: 24px;"><h3>Subjects</h3><div class="table-wrap"><table><thead><tr><th>Name</th><th>Code</th><th>Credits</th><th data-admin-only>Actions</th></tr></thead><tbody id="subjects-body"></tbody></table></div></section>
        </main>
    </div>
    <div id="toast-container"></div>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/common.js"></script>
    <script>
        async function loadSubjects() {
            try {
                const response = await apiRequest('/api/subjects');
                const isAdmin = getCurrentUser().role === 'ADMIN';
                const tableBody = document.getElementById('subjects-body');
                tableBody.replaceChildren();
                (response.subjects || []).forEach((subject) => {
                    const row = document.createElement('tr');
                    [subject.name, subject.code, subject.credits].forEach((value) => {
                        const cell = document.createElement('td');
                        cell.textContent = String(value);
                        row.appendChild(cell);
                    });
                    if (isAdmin) {
                        const actions = document.createElement('td');
                        const button = document.createElement('button');
                        button.className = 'secondary-btn';
                        button.textContent = 'Delete';
                        button.addEventListener('click', () => deleteSubject(subject.id));
                        actions.appendChild(button);
                        row.appendChild(actions);
                    }
                    tableBody.appendChild(row);
                });
            } catch (error) { showToast(error.message, 'error'); }
        }
        document.getElementById('subject-form').addEventListener('submit', async (event) => { event.preventDefault(); const payload = Object.fromEntries(new FormData(event.target).entries()); try { await apiRequest('/api/subjects', { method: 'POST', body: payload }); event.target.reset(); loadSubjects(); showToast('Subject saved.', 'success'); } catch (error) { showToast(error.message, 'error'); } });
        async function deleteSubject(id) { try { await apiRequest(`/api/subjects/${encodeURIComponent(id)}`, { method: 'DELETE' }); loadSubjects(); showToast('Subject deleted.', 'success'); } catch (error) { showToast(error.message, 'error'); } }
        async function logoutUser() { try { await apiRequest('/api/auth/logout', { method: 'POST' }); window.location.href = '/login'; } catch (error) { showToast('Logout failed', 'error'); } }
        checkAuth().then((user) => {
            if (user) loadSubjects();
        });
    </script>
</body>
</html>
