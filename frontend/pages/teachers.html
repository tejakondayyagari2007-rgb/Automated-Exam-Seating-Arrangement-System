<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teachers</title>
    <link rel="stylesheet" href="/static/css/global.css" />
    <link rel="stylesheet" href="/static/css/tables.css" />
    <link rel="stylesheet" href="/static/css/forms.css" />
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar"><div class="brand">SeatingSystem</div><nav><a href="/dashboard">Dashboard</a><a href="/students">Students</a><a class="active" href="/teachers">Teachers</a><a href="/rooms">Rooms</a><a href="/subjects">Subjects</a><a href="/exams">Exams</a><a href="/timetable">Timetable</a><a href="/seating">Seating</a><a href="/attendance">Attendance</a><a href="/reports">Reports</a><a href="/notifications">Notifications</a><a href="/settings">Settings</a></nav></aside>
        <main class="content">
            <div class="topbar"><h2>Teacher Management</h2><div class="topbar-right"><button class="secondary-btn" onclick="setTheme(!document.body.classList.contains('dark-mode'))">Dark Mode</button><button class="primary-btn" onclick="logoutUser()">Logout</button></div></div>
            <section class="card" data-admin-only>
                <h3>Add Teacher</h3>
                <form id="teacher-form" class="form-panel">
                    <input type="text" name="employee_id" placeholder="Employee ID" required />
                    <input type="text" name="name" placeholder="Name" required />
                    <input type="email" name="email" placeholder="Email" required />
                    <input type="text" name="phone" placeholder="Phone" />
                    <input type="number" name="department_id" placeholder="Department ID" />
                    <input type="text" name="designation" placeholder="Designation" />
                    <div class="form-actions wide"><button type="submit" class="primary-btn">Save Teacher</button></div>
                </form>
            </section>
            <section class="card" style="margin-top: 24px;"><h3>Teachers</h3><div class="table-wrap"><table><thead><tr><th>Employee</th><th>Name</th><th>Email</th><th>Designation</th><th data-admin-only>Actions</th></tr></thead><tbody id="teachers-body"></tbody></table></div></section>
        </main>
    </div>
    <div id="toast-container"></div>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/common.js"></script>
    <script>
        async function loadTeachers() {
            try {
                const response = await apiRequest('/api/teachers');
                const isAdmin = getCurrentUser().role === 'ADMIN';
                document.getElementById('teachers-body').innerHTML = (response.teachers || []).map((teacher) => `
                    <tr><td>${teacher.employee_id}</td><td>${teacher.name}</td><td>${teacher.email}</td><td>${teacher.designation}</td>${isAdmin ? `<td><button class="secondary-btn" onclick="deleteTeacher(${teacher.id})">Delete</button></td>` : ''}</tr>
                `).join('');
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        document.getElementById('teacher-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const payload = Object.fromEntries(new FormData(event.target).entries());
            try {
                await apiRequest('/api/teachers', { method: 'POST', body: payload });
                event.target.reset();
                loadTeachers();
                showToast('Teacher saved.', 'success');
            } catch (error) {
                showToast(error.message, 'error');
            }
        });

        async function deleteTeacher(id) {
            try {
                await apiRequest(`/api/teachers/${id}`, { method: 'DELETE' });
                loadTeachers();
                showToast('Teacher deleted.', 'success');
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        async function logoutUser() {
            try { await apiRequest('/api/auth/logout', { method: 'POST' }); window.location.href = '/login'; } catch (error) { showToast('Logout failed', 'error'); }
        }

        checkAuth().then((user) => {
            if (user) loadTeachers();
        });
    </script>
</body>
</html>
