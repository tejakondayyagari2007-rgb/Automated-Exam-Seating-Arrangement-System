<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Students</title>
    <link rel="stylesheet" href="/static/css/global.css" />
    <link rel="stylesheet" href="/static/css/tables.css" />
    <link rel="stylesheet" href="/static/css/forms.css" />
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">SeatingSystem</div>
            <nav>
                <a href="/dashboard">Dashboard</a>
                <a class="active" href="/students">Students</a>
                <a href="/teachers">Teachers</a>
                <a href="/rooms">Rooms</a>
                <a href="/subjects">Subjects</a>
                <a href="/exams">Exams</a>
                <a href="/timetable">Timetable</a>
                <a href="/seating">Seating</a>
                <a href="/attendance">Attendance</a>
                <a href="/reports">Reports</a>
                <a href="/notifications">Notifications</a>
                <a href="/settings">Settings</a>
            </nav>
        </aside>
        <main class="content">
            <div class="topbar">
                <h2>Student Management</h2>
                <div class="topbar-right">
                    <button class="secondary-btn" onclick="setTheme(!document.body.classList.contains('dark-mode'))">Dark Mode</button>
                    <button class="primary-btn" onclick="logoutUser()">Logout</button>
                </div>
            </div>

            <section class="card" data-admin-only>
                <h3>Add Student</h3>
                <form id="student-form" class="form-panel">
                    <input type="text" name="roll_no" placeholder="Roll number" required />
                    <input type="text" name="name" placeholder="Name" required />
                    <input type="email" name="email" placeholder="Email" required />
                    <input type="text" name="phone" placeholder="Phone" />
                    <input type="number" name="department_id" placeholder="Department ID" />
                    <input type="number" name="section_id" placeholder="Section ID" />
                    <input type="number" name="year" placeholder="Year" />
                    <div class="form-actions wide">
                        <button type="submit" class="primary-btn">Save Student</button>
                    </div>
                </form>
            </section>

            <section class="card" style="margin-top: 24px;">
                <h3>Students</h3>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Roll</th><th>Name</th><th>Email</th><th>Department</th><th>Year</th><th data-admin-only>Actions</th></tr></thead>
                        <tbody id="students-body"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <div id="toast-container"></div>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/common.js"></script>
    <script>
        async function loadStudents() {
            try {
                const response = await apiRequest('/api/students');
                const rows = response.students || [];
                const isAdmin = getCurrentUser().role === 'ADMIN';
                const tableBody = document.getElementById('students-body');
                tableBody.replaceChildren();
                rows.forEach((student) => {
                    const row = document.createElement('tr');
                    [
                        student.roll_no,
                        student.name,
                        student.email,
                        student.department_name || student.department_id || '—',
                        student.year || '—',
                    ].forEach((value) => {
                        const cell = document.createElement('td');
                        cell.textContent = String(value);
                        row.appendChild(cell);
                    });
                    if (isAdmin) {
                        const actions = document.createElement('td');
                        const button = document.createElement('button');
                        button.className = 'secondary-btn';
                        button.textContent = 'Delete';
                        button.addEventListener('click', () => deleteStudent(student.id));
                        actions.appendChild(button);
                        row.appendChild(actions);
                    }
                    tableBody.appendChild(row);
                });
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        document.getElementById('student-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const form = event.target;
            const payload = Object.fromEntries(new FormData(form).entries());
            try {
                await apiRequest('/api/students', { method: 'POST', body: payload });
                form.reset();
                loadStudents();
                showToast('Student saved successfully.', 'success');
            } catch (error) {
                showToast(error.message, 'error');
            }
        });

        async function deleteStudent(id) {
            try {
                await apiRequest(`/api/students/${encodeURIComponent(id)}`, { method: 'DELETE' });
                loadStudents();
                showToast('Student deleted.', 'success');
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        async function logoutUser() {
            try {
                await apiRequest('/api/auth/logout', { method: 'POST' });
                window.location.href = '/login';
            } catch (error) {
                showToast('Logout failed', 'error');
            }
        }

        checkAuth().then((user) => {
            if (user) loadStudents();
        });
    </script>
</body>
</html>
