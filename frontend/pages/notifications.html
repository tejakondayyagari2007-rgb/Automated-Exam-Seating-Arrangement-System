<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications</title>
    <link rel="stylesheet" href="/static/css/global.css" />
    <link rel="stylesheet" href="/static/css/tables.css" />
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar"><div class="brand">SeatingSystem</div><nav><a href="/dashboard">Dashboard</a><a href="/students">Students</a><a href="/teachers">Teachers</a><a href="/rooms">Rooms</a><a href="/subjects">Subjects</a><a href="/exams">Exams</a><a href="/timetable">Timetable</a><a href="/seating">Seating</a><a href="/attendance">Attendance</a><a href="/reports">Reports</a><a class="active" href="/notifications">Notifications</a><a href="/settings">Settings</a></nav></aside>
        <main class="content"><div class="topbar"><h2>Notifications</h2><div class="topbar-right"><button class="secondary-btn" onclick="setTheme(!document.body.classList.contains('dark-mode'))">Dark Mode</button><button class="primary-btn" onclick="logoutUser()">Logout</button></div></div>
            <section class="card"><h3>Unread</h3><div id="notifications-body"></div></section>
        </main>
    </div>
    <div id="toast-container"></div>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/common.js"></script>
    <script>
        async function loadNotifications() {
            try {
                const response = await apiRequest('/api/notifications');
                const container = document.getElementById('notifications-body');
                container.replaceChildren();
                const notifications = response.notifications || [];
                notifications.forEach((notification) => {
                    const item = document.createElement('div');
                    item.className = 'list-item';
                    const title = document.createElement('strong');
                    title.textContent = notification.title || '';
                    const message = document.createElement('small');
                    message.textContent = notification.message || '';
                    item.append(title, document.createElement('br'), message);
                    container.appendChild(item);
                });
                if (!notifications.length) container.textContent = 'No notifications yet.';
            } catch (error) { showToast(error.message, 'error'); }
        }
        async function logoutUser() { try { await apiRequest('/api/auth/logout', { method: 'POST' }); window.location.href = '/login'; } catch (error) { showToast('Logout failed', 'error'); } }
        checkAuth().then((user) => {
            if (user) loadNotifications();
        });
    </script>
</body>
</html>
